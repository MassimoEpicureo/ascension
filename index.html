<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ascension</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#E7E3DB;
    --header-bg:#EFECE5;
    --surface:#FBF9F6;
    --surface-2:#FFFDFA;
    --surface-3:#F2EFE9;
    --line:#D3CCC2;
    --line-soft:#DCD5CB;
    --ink:#16191B;
    --ink-soft:#6F7479;
    --ink-softer:#4A4F53;
    --locked:#9C958A;
    --locked-bar:#D3CCC2;
    --accent:#2FD07A;
    --accent-hover:#43E28D;
    --accent-ink:#0E1A14;
    --accent-text:#14803F;
    --accent-tint-bg:#E2F6EA;
    --accent-tint-border:#BCE6CD;
    --shadow:0 1px 2px rgba(20,20,15,.05), 0 10px 26px rgba(20,20,15,.06);
    /* La carte "hero" est volontairement toujours sombre, comme un panneau de nuit en montagne — identique dans les deux thèmes. */
    --hero-bg:#1D2A31;
    --hero-ink:#F1EEE8;
    --hero-ink-soft:#9FB6BF;
    --hero-body:#C3D2D8;
    --hero-chip-bg:#16222899;
    --hero-chip-border:#3B4E56;
    --hero-ridge-1:#2A3B44;
    --hero-ridge-2:#33474F;
  }
  /* Palette unique et volontairement claire — celle de la maquette d'origine,
     conservée telle quelle quel que soit le thème du système. */

  *,*::before,*::after{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Archivo', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:var(--ink); }
  a:hover{ color:var(--accent-text); }
  button{ font:inherit; }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  @keyframes asc-pop{ 0%{transform:scale(.82);opacity:0} 60%{transform:scale(1.05)} 100%{transform:scale(1);opacity:1} }
  @keyframes asc-pulse{ 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.45;transform:scale(.76)} }
  @keyframes asc-fall{ 0%{transform:translateY(-10vh) rotate(0deg);opacity:1} 100%{transform:translateY(90vh) rotate(560deg);opacity:0} }
  @keyframes asc-rise{ 0%{transform:translateY(8px);opacity:0} 100%{transform:translateY(0);opacity:1} }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

  /* ---- header ---- */
  .topbar{
    display:flex; flex-wrap:wrap; gap:16px; align-items:center; justify-content:space-between;
    padding:16px clamp(16px,4vw,44px);
    border-bottom:1px solid var(--line);
    background:var(--header-bg);
    position:sticky; top:0; z-index:5;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-logo{ display:block; width:48px; height:48px; object-fit:contain; flex:none; }
  .brand-text{ display:flex; flex-direction:column; gap:2px; }
  .brand-name{ font-weight:800; font-size:18px; letter-spacing:.2em; line-height:1; }
  .brand-sub{ font-size:10px; letter-spacing:.14em; color:var(--ink-soft); text-transform:uppercase; }
  .rank-chips{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .rank-label{ font-size:11px; letter-spacing:.08em; color:var(--ink-soft); }
  .rank-value{ font-weight:700; font-size:14px; }
  .chip-divider{ width:1px; height:16px; background:var(--line); }
  .xp-chip{ font-size:13px; font-weight:600; background:var(--ink); color:var(--header-bg); padding:5px 10px; border-radius:4px; }
  .streak-chip{ font-size:13px; font-weight:600; border:1px solid var(--line); padding:4px 10px; border-radius:4px; }

  .content{ padding:clamp(16px,4vw,44px); display:flex; flex-direction:column; gap:clamp(20px,3vw,30px); max-width:1180px; margin:0 auto; }

  /* ---- hero ---- */
  .hero{
    position:relative; overflow:hidden; border-radius:16px;
    background:var(--hero-bg); color:var(--hero-ink);
    padding:clamp(20px,4vw,34px);
    isolation:isolate;
  }
  .hero-ridge{ position:absolute; inset:auto 0 0 0; width:100%; height:70%; z-index:-2; opacity:.5; }
  .hero-watermark{ position:absolute; top:-8%; right:-6%; width:min(280px,42%); height:auto; opacity:.1; z-index:-1; pointer-events:none; }
  .hero-row{ display:flex; flex-wrap:wrap; gap:24px; align-items:flex-end; justify-content:space-between; }
  .hero-text{ display:flex; flex-direction:column; gap:10px; min-width:min(100%,300px); }
  .hero-kicker{ font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--hero-ink-soft); }
  .hero-title{ margin:0; font-size:clamp(24px,4.2vw,40px); line-height:1.05; font-weight:800; letter-spacing:-.02em; text-wrap:balance; }
  .hero-sub{ margin:0; font-size:14.5px; color:var(--hero-body); max-width:48ch; text-wrap:pretty; }
  .hero-action{ display:flex; flex-direction:column; gap:12px; align-items:flex-start; }
  .hero-cta{
    display:inline-flex; align-items:center; gap:10px; background:var(--accent); color:var(--accent-ink);
    font-weight:700; font-size:15.5px; padding:14px 22px; border-radius:9px; text-decoration:none; min-height:48px;
    border:none; cursor:pointer;
  }
  .hero-cta:hover{ background:var(--accent-hover); }
  .countdown{ display:flex; gap:8px; flex-wrap:wrap; }
  .countdown-unit{ background:var(--hero-chip-bg); border:1px solid var(--hero-chip-border); border-radius:8px; padding:10px 13px; min-width:60px; text-align:center; }
  .countdown-val{ font-size:clamp(19px,3vw,25px); font-weight:600; line-height:1; }
  .countdown-lbl{ font-size:9px; letter-spacing:.12em; color:var(--hero-ink-soft); text-transform:uppercase; margin-top:4px; }

  /* ---- buttons (shared) ---- */
  .btn{ font-family:'Archivo',sans-serif; font-weight:700; font-size:14.5px; border-radius:9px; padding:12px 18px; border:1px solid transparent; cursor:pointer; display:inline-flex; align-items:center; gap:8px; text-decoration:none; min-height:44px; transition:background .15s ease, transform .12s ease; }
  .btn:active{ transform:scale(.98); }
  .btn:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  .btn-dark{ background:var(--ink); color:var(--surface-2); }
  .btn-dark:hover{ opacity:.9; }
  .btn-accent{ background:var(--accent); color:var(--accent-ink); }
  .btn-accent:hover{ background:var(--accent-hover); }
  .btn-ghost{ background:transparent; border-color:var(--line); color:var(--ink); }
  .btn-ghost:hover{ background:var(--surface-3); }
  .btn-sm{ padding:8px 13px; font-size:12.5px; min-height:auto; }

  /* ---- track ---- */
  .track{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:clamp(16px,3vw,26px); display:flex; flex-direction:column; gap:16px; box-shadow:var(--shadow); }
  .track-head{ display:flex; flex-wrap:wrap; gap:14px; align-items:baseline; justify-content:space-between; }
  .track-eyebrow{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 4px; }
  .track-name{ margin:0; font-size:clamp(19px,2.4vw,25px); font-weight:800; letter-spacing:-.01em; }
  .track-count{ display:flex; align-items:center; gap:10px; }
  .track-count-val{ font-size:20px; font-weight:600; }
  .track-count-lbl{ font-size:10.5px; letter-spacing:.1em; color:var(--ink-soft); text-transform:uppercase; }
  .track-bar{ height:9px; border-radius:99px; background:var(--bg); overflow:hidden; }
  .track-bar-fill{ height:100%; background:var(--accent); border-radius:99px; transition:width .5s cubic-bezier(.2,.8,.2,1); }
  .track-tools{ display:flex; justify-content:flex-end; }

  .chapter-title{ font-size:.66rem; font-weight:600; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-soft); margin:0 0 8px; }
  .levels{ display:grid; grid-template-columns:repeat(auto-fill, minmax(120px,1fr)); gap:8px; }
  .node{
    text-align:left; cursor:pointer; background:var(--surface-2); border:1px solid var(--line); border-radius:11px;
    padding:11px; display:flex; flex-direction:column; gap:7px; min-height:104px; font-family:inherit; color:var(--ink);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .node:hover{ transform:translateY(-2px); }
  .node:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  .node[data-state="locked"]{ opacity:.62; cursor:default; }
  .node[data-state="locked"]:hover{ transform:none; }
  .node.is-selected{ box-shadow:0 0 0 2px var(--ink); }
  .node-top{ display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .node-niv{ font-size:11px; font-weight:600; letter-spacing:.07em; color:var(--ink-soft); }
  .node-title{ font-weight:700; font-size:12.5px; line-height:1.22; text-wrap:pretty; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .node-meta{ margin-top:auto; display:flex; align-items:center; gap:6px; font-size:10px; color:var(--ink-soft); }
  .node-dot{ width:3px; height:3px; border-radius:99px; background:var(--locked-bar); flex:none; }
  .node-bar{ height:3px; border-radius:99px; }

  /* ---- detail ---- */
  .detail{ background:var(--surface-3); border:1px solid var(--line-soft); border-radius:13px; padding:clamp(14px,2.4vw,22px); display:flex; flex-wrap:wrap; gap:22px; justify-content:space-between; animation:asc-rise .3s ease-out; }
  .detail-main{ display:flex; flex-direction:column; gap:9px; min-width:min(100%,320px); flex:1; }
  .detail-eyebrow{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft); }
  .detail-title{ margin:0; font-size:clamp(17px,2.2vw,22px); font-weight:800; letter-spacing:-.01em; text-wrap:pretty; }
  .detail-tags{ display:flex; flex-wrap:wrap; gap:7px; }
  .detail-tag{ font-size:11.5px; background:var(--surface-2); border:1px solid var(--line-soft); border-radius:5px; padding:5px 9px; }
  .detail-blurb{ margin:0; font-size:14px; line-height:1.5; color:var(--ink-softer); max-width:54ch; }
  .detail-actions{ display:flex; flex-direction:column; gap:9px; align-items:stretch; min-width:min(100%,240px); }
  .detail-actions .btn{ justify-content:space-between; }
  .done-chip{ font-size:11.5px; color:var(--accent-text); background:var(--accent-tint-bg); border:1px solid var(--accent-tint-border); border-radius:6px; padding:9px 11px; text-align:center; }
  .undo-btn{ cursor:pointer; background:transparent; color:var(--ink-soft); border:1px solid var(--line-soft); font-size:12px; padding:9px; border-radius:6px; }
  .undo-btn:hover{ color:var(--ink); }
  .locked-note{ font-size:12.5px; color:var(--ink-soft); line-height:1.45; }

  /* ---- organize panel ---- */
  .organize-panel{ border:1px dashed var(--line); border-radius:13px; padding:4px 16px; display:flex; flex-direction:column; max-height:420px; overflow-y:auto; }
  .organize-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 0; border-bottom:1px solid var(--line); }
  .organize-row:last-child{ border-bottom:none; }
  .organize-row.is-done{ opacity:.5; }
  .organize-pos{ font-weight:700; font-size:.8rem; width:26px; flex:none; color:var(--ink-soft); }
  .organize-info{ flex:1; min-width:140px; }
  .organize-info .t{ font-size:.8rem; font-weight:500; }
  .organize-info .m{ font-size:.68rem; color:var(--ink-soft); }
  .organize-select{ font-size:.74rem; padding:6px 8px; border-radius:8px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); flex:1; min-width:150px; }
  .organize-arrows{ display:flex; gap:4px; flex:none; }
  .icon-btn{ width:26px; height:26px; border-radius:8px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
  .icon-btn:hover{ background:var(--surface-3); }
  .icon-btn[disabled]{ opacity:.3; cursor:not-allowed; }
  .organize-badge{ font-size:.66rem; color:var(--ink-soft); white-space:nowrap; }
  .organize-hint{ font-size:.76rem; color:var(--ink-soft); margin:10px 0 4px; }

  /* ---- badges ---- */
  .badges-section{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:clamp(16px,3vw,26px); display:flex; flex-direction:column; gap:14px; box-shadow:var(--shadow); }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .section-head h2{ margin:0; font-size:clamp(17px,2.2vw,21px); font-weight:800; }
  .badges-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:9px; }
  .badge{ border:1px solid var(--line-soft); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:5px; background:var(--surface-2); }
  .badge-top{ display:flex; align-items:center; gap:8px; }
  .badge-dot{ width:11px; height:11px; border-radius:99px; flex:none; }
  .badge-name{ font-weight:700; font-size:13px; }
  .badge-req{ font-size:10.5px; color:var(--ink-soft); line-height:1.35; }

  /* ---- footer ---- */
  .stats-footer{ display:flex; flex-wrap:wrap; gap:18px; align-items:center; justify-content:space-between; border-top:1px solid var(--line); padding-top:20px; }
  .total-block{ display:flex; align-items:baseline; gap:12px; }
  .total-value{ font-size:clamp(26px,4.6vw,38px); font-weight:600; line-height:1; }
  .total-label{ font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); }
  .footer-stats{ display:flex; flex-wrap:wrap; gap:22px; }
  .fs-item{ display:flex; flex-direction:column; gap:3px; }
  .fs-label{ font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); }
  .fs-value{ font-weight:600; font-size:14.5px; }
  .reset-link{ background:none; border:none; font-size:.74rem; color:var(--ink-soft); text-decoration:underline; text-underline-offset:2px; cursor:pointer; padding:0; }
  .reset-link:hover{ color:var(--ink); }
  .footer-resets{ display:flex; gap:16px; flex-wrap:wrap; }

  .confetti-layer{ position:fixed; inset:0; pointer-events:none; z-index:60; overflow:hidden; }
  .confetti-piece{ position:absolute; top:0; width:8px; height:13px; border-radius:2px; animation:asc-fall 1.4s ease-in forwards; }

  @media (max-width:480px){
    .track-head{ align-items:flex-start; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="logo.png" alt="Ascension" width="48" height="48">
      <div class="brand-text">
        <span class="brand-name mono">ASCENSION</span>
        <span class="brand-sub">Poids du corps · 104 séances</span>
      </div>
    </div>
    <div class="rank-chips">
      <span class="rank-label mono">RANG</span>
      <span class="rank-value" id="rankValue">Randonneur</span>
      <span class="chip-divider"></span>
      <span class="xp-chip mono" id="xpChip">0 XP</span>
      <span class="streak-chip mono" id="streakChip">0 semaine</span>
    </div>
  </header>

  <main class="content">
    <section class="hero" id="hero">
      <svg class="hero-ridge" viewBox="0 0 600 160" preserveAspectRatio="none" aria-hidden="true">
        <polygon points="0,160 150,42 300,160" fill="var(--hero-ridge-1)"></polygon>
        <polygon points="200,160 380,20 560,160" fill="var(--hero-ridge-2)"></polygon>
        <polygon points="380,20 420,64 340,64" fill="var(--accent)" opacity=".55"></polygon>
      </svg>
      <img class="hero-watermark" src="logo.png" alt="" aria-hidden="true">
      <div class="hero-row">
        <div class="hero-text">
          <span class="hero-kicker mono" id="heroKicker"></span>
          <h1 class="hero-title" id="heroTitle"></h1>
          <p class="hero-sub" id="heroSub"></p>
        </div>
        <div class="hero-action" id="heroAction"></div>
      </div>
    </section>

    <section class="track" data-track="haut" id="track-haut">
      <div class="track-head">
        <div>
          <p class="track-eyebrow mono">Mercredi · parcours 01</p>
          <h2 class="track-name">Haut du corps</h2>
        </div>
        <div class="track-count">
          <span class="track-count-val mono" id="hautCountVal">00 / 52</span>
        </div>
      </div>
      <div class="track-bar"><div class="track-bar-fill" id="hautFill" style="width:0%"></div></div>
      <div class="track-tools"><button class="btn btn-ghost btn-sm" type="button" id="organizeToggleHaut">Organiser le programme</button></div>
      <div id="hautLevels"></div>
      <div class="organize-panel" id="hautOrganize" hidden></div>
      <div class="detail" id="hautDetail"></div>
    </section>

    <section class="track" data-track="bas" id="track-bas">
      <div class="track-head">
        <div>
          <p class="track-eyebrow mono">Dimanche · parcours 02</p>
          <h2 class="track-name">Bas du corps + Core</h2>
        </div>
        <div class="track-count">
          <span class="track-count-val mono" id="basCountVal">00 / 52</span>
        </div>
      </div>
      <div class="track-bar"><div class="track-bar-fill" id="basFill" style="width:0%"></div></div>
      <div class="track-tools"><button class="btn btn-ghost btn-sm" type="button" id="organizeToggleBas">Organiser le programme</button></div>
      <div id="basLevels"></div>
      <div class="organize-panel" id="basOrganize" hidden></div>
      <div class="detail" id="basDetail"></div>
    </section>

    <section class="badges-section">
      <div class="section-head">
        <h2>Badges</h2>
        <span class="mono" id="badgeLabel" style="font-size:12px;color:var(--ink-soft)"></span>
      </div>
      <div class="badges-grid" id="badgesGrid"></div>
    </section>

    <footer class="stats-footer">
      <div class="total-block">
        <span class="total-value mono" id="totalValue">00 / 104</span>
        <span class="total-label">séances gravies</span>
      </div>
      <div class="footer-stats">
        <div class="fs-item"><span class="fs-label mono">Dernière séance</span><span class="fs-value" id="lastSession">—</span></div>
        <div class="fs-item"><span class="fs-label mono">Temps cumulé</span><span class="fs-value" id="totalMinutes">0 min</span></div>
      </div>
      <div class="footer-resets">
        <button class="reset-link" id="resetHaut" data-track="haut">Réinitialiser le parcours Haut du corps</button>
        <button class="reset-link" id="resetBas" data-track="bas">Réinitialiser le parcours Bas du corps</button>
      </div>
    </footer>
    <p class="mono" id="syncNote" style="font-size:.76rem;color:var(--ink-soft);margin:-8px 0 0;">Chargement de ta progression…</p>
  </main>
</div>
<div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>

<script>
(function(){
  "use strict";

  /* ================= CATALOGUE (identique à la version précédente) ================= */
  var CATALOG = {
    haut: [
      { id:"h1", title:"7Min Effective Home Chest Workout (No Equipment)", url:"https://www.youtube.com/watch?v=sSIccj82Dyg", channel:"THENX / Chris Heria", duration:"7 min", focus:"pectoraux", tier:2 },
      { id:"h2", title:"5min Home CHEST Workout ANYONE Can Do!", url:"https://www.youtube.com/watch?v=hsRWz7HMxWM", channel:"THENX / Chris Heria", duration:"5 min", focus:"pectoraux", tier:1 },
      { id:"h3", title:"No Gym? DO THIS Chest Workout From Home", url:"https://www.youtube.com/watch?v=ILIe_KJ_bKk", channel:"THENX / Chris Heria", duration:null, focus:"pectoraux", tier:2 },
      { id:"h4", title:"At Home Back Workout — No Equipment Needed!", url:"https://www.youtube.com/watch?v=GZNxI-U1NbM", channel:"THENX / Chris Heria", duration:null, focus:"dos", tier:2 },
      { id:"h5", title:"At Home Back Workout - No Equipment Required", url:"https://www.youtube.com/watch?v=nfsQW1uGoBg", channel:"THENX / Chris Heria", duration:null, focus:"dos", tier:2 },
      { id:"h6", title:"5 MIN Home Back Workout // No Equipment", url:"https://www.youtube.com/watch?v=Z1_9LcBHWt4", channel:"THENX / Chris Heria", duration:"5 min", focus:"dos", tier:1 },
      { id:"h7", title:"More Than Just A Back Workout", url:"https://www.youtube.com/watch?v=hXZ36ru17fc", channel:"THENX / Chris Heria", duration:null, focus:"dos", tier:3 },
      { id:"h8", title:"DO THIS For A BIGGER BACK | Minimum Equipment Needed", url:"https://www.youtube.com/watch?v=hsCILrG2Op4", channel:"THENX / Chris Heria", duration:null, focus:"dos", tier:3 },
      { id:"h9", title:"Complete 10 Min Shoulder Workout | No Equipment", url:"https://www.youtube.com/watch?v=jBPdbt0Fxb4", channel:"THENX / Chris Heria", duration:"10 min", focus:"épaules", tier:2 },
      { id:"h10", title:"15 MIN UPPER BODY WORKOUT - No Equipment (Back, Arms, Chest, Shoulders)", url:"https://www.youtube.com/watch?v=ESkI_WR1qqc", channel:"MadFit", duration:"15 min", focus:"haut du corps complet", tier:2 },
      { id:"h11", title:"INTENSE AT HOME UPPER BODY WORKOUT (No Equipment)", url:"https://www.youtube.com/watch?v=70CPGAn9STk", channel:"MadFit", duration:null, focus:"haut du corps complet", tier:3 },

  function parseMinutes(duration){

  function catalogById(trackKey, id){
    var list = CATALOG[trackKey];
    for (var i = 0; i < list.length; i++){ if (list[i].id === id) return list[i]; }
    return null;
  }

  function buildDefaultOrder(trackKey, count){
    var list = CATALOG[trackKey].slice();
    var groups = {};
    var order = [];
    list.forEach(function(v){ (groups[v.focus] = groups[v.focus] || []).push(v); });
    var focusKeys = Object.keys(groups);
    focusKeys.forEach(function(f){ groups[f].sort(function(a,b){ return a.tier - b.tier; }); });
    var idx = 0;
    while (order.length < count){
      var addedAny = false;
      for (var i = 0; i < focusKeys.length; i++){
        var g = groups[focusKeys[i]];
        if (g[idx]){ order.push(g[idx].id); addedAny = true; if (order.length >= count) break; }
      }
      if (!addedAny) break;
      idx++;
    }
    return order;
  }

  function defaultState(){
    return {
      haut:{ unlocked:1, completed:{}, order:buildDefaultOrder("haut", TOTAL_PER_TRACK) },
      bas:{ unlocked:1, completed:{}, order:buildDefaultOrder("bas", TOTAL_PER_TRACK) }
    };
  }

  function isValidOrder(trackKey, order){
    if (!Array.isArray(order) || order.length !== TOTAL_PER_TRACK) return false;
    var seen = {};
    for (var i = 0; i < order.length; i++){
      var id = order[i];
      if (seen[id]) return false;
      seen[id] = true;
      if (!catalogById(trackKey, id)) return false;
    }
    return true;
  }

  function mergeState(raw){
    var d = defaultState();
    if (!raw || typeof raw !== "object") return d;
    ["haut","bas"].forEach(function(k){
      if (raw[k] && typeof raw[k] === "object"){
        if (typeof raw[k].unlocked === "number") d[k].unlocked = raw[k].unlocked;
        if (raw[k].completed && typeof raw[k].completed === "object") d[k].completed = raw[k].completed;
        if (isValidOrder(k, raw[k].order)) d[k].order = raw[k].order;
      }
    });
    return d;
  }

  function markComplete(trackKey, pos){
    var t = state[trackKey];
    if (pos !== t.unlocked) return;
    t.completed[pos] = new Date().toISOString();
    t.unlocked = Math.min(pos + 1, TOTAL_PER_TRACK + 1);
    ui.selected[trackKey] = Math.min(pos + 1, TOTAL_PER_TRACK);
    saveState();
    spawnConfetti();
  }

  function undoComplete(trackKey, pos){
    var t = state[trackKey];
    if (pos !== t.unlocked - 1) return; /* on ne peut annuler que la dernière validation */
    delete t.completed[pos];
    t.unlocked = pos;
    ui.selected[trackKey] = pos;
    saveState();

  function swapPositions(trackKey, posA, posB){

  function renderLevels(trackKey){

  /* ================= hero / rang / xp / streak / badges ================= */
  function weekKey(d){
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
    var y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return t.getUTCFullYear() * 100 + Math.ceil(((t - y0) / 86400000 + 1) / 7);
  }

  function computeGlobals(){
    var hautDone = Object.keys(state.haut.completed).length;
    var basDone = Object.keys(state.bas.completed).length;
    var total = hautDone + basDone;
    var minutes = 0;
    ["haut","bas"].forEach(function(tk){
      Object.keys(state[tk].completed).forEach(function(pos){ minutes += parseMinutes(videoAt(tk, parseInt(pos,10)).duration); });
    });
    var allDates = Object.keys(state.haut.completed).map(function(k){ return state.haut.completed[k]; })
      .concat(Object.keys(state.bas.completed).map(function(k){ return state.bas.completed[k]; }));
    var weeks = allDates.map(function(iso){ return weekKey(new Date(iso)); });
    var uniq = Array.from(new Set(weeks)).sort(function(a,b){ return b - a; });
    var streak = 0;
    if (uniq.length){
      var cur = weekKey(new Date());
      if (uniq[0] === cur || uniq[0] === cur - 1){
        streak = 1;
        for (var i = 1; i < uniq.length; i++){ if (uniq[i-1] - uniq[i] === 1) streak++; else break; }
      }
    }
    var ranks = [[0,"Randonneur"],[8,"Grimpeur"],[20,"Alpiniste"],[40,"Alpiniste confirmé"],[65,"Ascensionniste"],[90,"Guide de haute montagne"],[104,"Sommet"]];
    var rank = ranks.filter(function(r){ return total >= r[0]; }).pop()[1];
    return { hautDone:hautDone, basDone:basDone, total:total, minutes:minutes, streak:streak, rank:rank, lastIso: allDates.sort().slice(-1)[0] || null };
  }

  function nextSessionInfo(now){
    var todaySession = SESSIONS.find(function(s){ return s.dow === now.getDay(); });
    var best = Infinity, next = null;
    SESSIONS.forEach(function(s){
      for (var k = 0; k < 8; k++){
        var c = new Date(now);
        c.setDate(now.getDate() + k);
        c.setHours(s.hour, 0, 0, 0);
        var diff = c.getTime() - now.getTime();
        if (diff > 0 && diff < best){ best = diff; next = s; }
      }
    });
    return { todaySession:todaySession, next:next, diffMs:best };
  }

      actionEl.innerHTML =
        '<div class="countdown" id="countdown">' +
          '<div class="countdown-unit"><div class="countdown-val mono" data-u="d">00</div><div class="countdown-lbl">jours</div></div>' +
          '<div class="countdown-unit"><div class="countdown-val mono" data-u="h">00</div><div class="countdown-lbl">heures</div></div>' +
          '<div class="countdown-unit"><div class="countdown-val mono" data-u="m">00</div><div class="countdown-lbl">min</div></div>' +
          '<div class="countdown-unit"><div class="countdown-val mono" data-u="s">00</div><div class="countdown-lbl">sec</div></div>' +
        '</div>';
    }
    tickCountdown();
  }

  function tickCountdown(){
    var box = document.getElementById("countdown");
    if (!box) return;
    var info = nextSessionInfo(new Date());
    if (info.todaySession) return;
    var secs = Math.max(0, Math.floor(info.diffMs / 1000));
    var d = Math.floor(secs / 86400), h = Math.floor((secs % 86400) / 3600), m = Math.floor((secs % 3600) / 60), s = secs % 60;
    var map = { d:d, h:h, m:m, s:s };
    Array.prototype.forEach.call(box.querySelectorAll("[data-u]"), function(el){
      el.textContent = pad2(map[el.getAttribute("data-u")]);
    });
  }

  function renderBadges(g){
    var defs = [
      { name:"Premier pas", req:"1 séance terminée", ok:g.total >= 1 },
      { name:"Quart de parcours", req:"26 séances terminées", ok:g.total >= 26 },
      { name:"Mi-parcours", req:"52 séances terminées", ok:g.total >= 52 },
      { name:"Trois quarts", req:"78 séances terminées", ok:g.total >= 78 },
      { name:"Buste d'acier", req:"parcours Haut du corps complet", ok:g.hautDone >= TOTAL_PER_TRACK },
      { name:"Appuis solides", req:"parcours Bas du corps complet", ok:g.basDone >= TOTAL_PER_TRACK },
      { name:"Régulier", req:"4 semaines d'affilée", ok:g.streak >= 4 },
      { name:"Sommet", req:"les 104 séances", ok:g.total >= TOTAL_PER_TRACK * 2 }
    ];
    document.getElementById("badgeLabel").textContent = defs.filter(function(b){ return b.ok; }).length + " / " + defs.length + " obtenus";
    document.getElementById("badgesGrid").innerHTML = defs.map(function(b){
      return '<div class="badge" style="opacity:' + (b.ok ? 1 : .55) + '">' +
        '<div class="badge-top"><span class="badge-dot" style="background:' + (b.ok ? "var(--accent)" : "var(--line-soft)") + '"></span><span class="badge-name">' + b.name + '</span></div>' +
        '<span class="badge-req">' + b.req + '</span>' +
      '</div>';
    }).join("");
  }

  function renderFooter(g){
    document.getElementById("totalValue").textContent = pad2(g.total) + " / " + (TOTAL_PER_TRACK * 2);
    document.getElementById("lastSession").textContent = g.lastIso ? formatDate(g.lastIso) : "aucune pour l'instant";
    document.getElementById("totalMinutes").textContent = g.minutes + " min";

    var note = document.getElementById("syncNote");
    if (syncStatus === "synced") note.textContent = "Progression et programme personnalisé synchronisés automatiquement entre tous tes appareils (PC, Android...).";
    else if (syncStatus === "local") note.textContent = "Progression sauvegardée sur ce navigateur uniquement — la synchronisation entre appareils n'est pas disponible ici.";
    else if (syncStatus === "error") note.textContent = "Synchronisation momentanément indisponible — ta progression reste sauvegardée sur cet appareil.";
    else note.textContent = "Chargement de ta progression…";
  }

  function render(){
    var g = computeGlobals();
    renderTopbar(g);
    renderHero();
    renderTrack("haut");
    renderTrack("bas");
    renderBadges(g);
    renderFooter(g);
  }

  function wireReset(trackKey, btnId){
    var btn = document.getElementById(btnId);
    btn.addEventListener("click", function(){
      if (!ui.resetArmed[trackKey]){
        ui.resetArmed[trackKey] = true;
        btn.textContent = "Sûr ? Cliquer à nouveau pour confirmer";
        setTimeout(function(){ ui.resetArmed[trackKey] = false; btn.textContent = "Réinitialiser le parcours " + (trackKey === "haut" ? "Haut du corps" : "Bas du corps"); }, 3000);
      } else {
        ui.resetArmed[trackKey] = false;
        btn.textContent = "Réinitialiser le parcours " + (trackKey === "haut" ? "Haut du corps" : "Bas du corps");
        resetTrack(trackKey);
      }
    });
  }
  wireReset("haut", "resetHaut");
  wireReset("bas", "resetBas");

  document.getElementById("organizeToggleHaut").addEventListener("click", function(){ ui.organizeOpen.haut = !ui.organizeOpen.haut; render(); });
  document.getElementById("organizeToggleBas").addEventListener("click", function(){ ui.organizeOpen.bas = !ui.organizeOpen.bas; render(); });

  render();
  setInterval(tickCountdown, 1000);

  (function initDb(){
    if (typeof window.claude === "undefined" || !window.claude || typeof window.claude.use !== "function"){
      syncStatus = "local"; renderFooter(computeGlobals()); return;
    }
    window.claude.use("db").then(function(cap){
      if (!cap){ syncStatus = "local"; renderFooter(computeGlobals()); return; }
      db = cap;
      db.doc("progress/state").onSnapshot(function(snap){
        if (snap.exists){ state = mergeState(snap.data()); }
        else { db.doc("progress/state").set(state).catch(function(){}); }
        syncStatus = "synced";
        render();
      }, function(){ syncStatus = "error"; renderFooter(computeGlobals()); });
    }).catch(function(){ syncStatus = "local"; renderFooter(computeGlobals()); });
  })();
})();
</script>
</body>
</html>
